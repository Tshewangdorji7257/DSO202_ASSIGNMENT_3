apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dso202.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_USER: {{ .Values.secret.dbUser | quote }}
  DB_PASSWORD: {{ required "secret.dbPassword is required: use -f environments/<env>.yaml or --set secret.dbPassword=..." .Values.secret.dbPassword | quote }}
  POSTGRES_USER: {{ .Values.secret.dbUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secret.dbPassword | quote }}
