# Run with: helm test <release> -n <namespace>
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-test-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dso202.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: {{ .Values.test.image }}
      command: ["sh", "-c"]
      args:
        - curl -fsS http://backend-svc:{{ .Values.backend.port }}/api/status | grep '"db":"connected"'
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {cpu: 100m, memory: 64Mi}
