# Defaults = the shared truth. Environment files in ../environments override them.
environment: dev

config:
  DB_HOST: db-svc
  DB_PORT: "5432"
  DB_NAME: taskdb
  POSTGRES_DB: taskdb
  APP_PORT: "8080"
  CORS_ORIGIN: "*"
  BACKEND_URL: http://localhost:8088
  LOG_LEVEL: info

# No default password on purpose: supply it with -f or --set (see environments/).
secret:
  dbUser: taskuser
  dbPassword: ""

database:
  image: {repository: rynorbu11/dso202-db, tag: "1.0", pullPolicy: IfNotPresent}
  replicas: 1
  storage: {size: 1Gi, storageClassName: ""}
  retainPvc: true          # Retain PVC on StatefulSet delete/scale-down
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 250m, memory: 256Mi}

backend:
  image: {repository: rynorbu11/dso202-backend, tag: "1.0", pullPolicy: IfNotPresent}  # image name is an assumption
  replicas: 1
  port: 8080
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 250m, memory: 256Mi}

frontend:
  image: {repository: rynorbu11/dso202-frontend, tag: "1.0", pullPolicy: IfNotPresent}  # image name is an assumption
  replicas: 1
  port: 8080
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 250m, memory: 256Mi}

ingress:
  enabled: true
  className: nginx
  host: ""                 # empty = match any host
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"

quota:
  enabled: true
  hard:
    pods: "10"
    requests.cpu: 1500m
    requests.memory: 768Mi
    limits.cpu: "3"
    limits.memory: 1536Mi

test:
  image: curlimages/curl:8.10.1
